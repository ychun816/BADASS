# router_yilin — runtime notes and FRR skeleton (no IPs configured)
# Usage: start the container in GNS3, then run the commands below from the router console.

# 1) Kernel and interfaces
# Ensure forwarding enabled (image sets this via sysctl file, verify):
#   sysctl net.ipv4.ip_forward
# List interfaces (GNS3 provides eth0, eth1, ...):
#   ip addr

# 2) Assign temporary IPs for testing (do NOT bake into images)
# Example (replace with topology-specific addresses):
#   ip addr add 192.0.2.2/24 dev eth0
#   ip link set eth0 up
#   ip addr add 10.0.0.1/24 dev eth1
#   ip link set eth1 up

# 3) Start FRR (router image's CMD already runs docker-start). If needed manually:
#   /usr/lib/frr/docker-start

# 4) FRR vtysh example skeleton (no IPs)
# Run: vtysh -c "configure terminal"
# then paste the blocks below (adjust AS numbers and router-ids per topology):
#
# hostname router_yilin
#!
# router ospf
#  passive-interface default
#  no passive-interface eth0
#!
# router isis
#  net 49.0001.0000.0000.0001.00
#!
# router bgp 65000
#  bgp router-id 1.1.1.1
#  no bgp default ipv4-unicast
#  neighbor 1.1.1.254 remote-as 65000
#  address-family l2vpn evpn
#    neighbor 1.1.1.254 activate
#  exit-address-family
#!
#  show running-config (to verify)
#